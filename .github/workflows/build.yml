name: Build AZA Android APK

on:
workflow_dispatch:
push:
paths:
- "AZA_Android_GitHub_Build-1.zip"
- ".github/workflows/build.yml"

permissions:
contents: read

jobs:
inspect:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check uploaded ZIP
    run: |
      echo "Checking AZA Android project ZIP..."
      test -f "AZA_Android_GitHub_Build-1.zip"
      unzip -l "AZA_Android_GitHub_Build-1.zip"
